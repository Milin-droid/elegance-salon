
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Registration | Elegance Beauty Salon</title>

    <style>
        :root {
            --cream: #f8f4ec;
            --white: #fffdf9;
            --black: #171613;
            --gold: #bd9145;
            --gold-dark: #95641f;
            --muted: #6f6b64;
            --border: #e8dfd1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--cream);
            color: var(--black);
            line-height: 1.6;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            margin: 20px auto;
        }

        .register-card {
            padding: 38px;
            background: var(--white);
            border: 1px solid var(--border);
            box-shadow: 0 12px 35px rgba(23, 22, 19, 0.06);
        }

        .brand-label {
            margin: 0 0 12px;
            color: var(--gold-dark);
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 12px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(30px, 5vw, 38px);
            font-weight: normal;
            line-height: 1.2;
        }

        .intro {
            margin-bottom: 25px;
            color: var(--muted);
            font-size: 14px;
        }

        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: bold;
        }

        form input {
            display: block;
            width: 100%;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: #fff;
            color: var(--black);
            font: inherit;
        }

        form input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(189, 145, 69, 0.13);
        }

        .helptext {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        form ul {
            padding-left: 20px;
            color: var(--muted);
            font-size: 12px;
        }

        form .errorlist {
            color: #a52a2a;
            font-size: 13px;
        }

        .register-button {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--black);
            background: var(--black);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .register-button:hover {
            border-color: var(--gold-dark);
            background: var(--gold-dark);
        }

        .login-text {
            margin-top: 24px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        a {
            color: var(--gold-dark);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
        }

        .message {
            margin-bottom: 16px;
            padding: 12px;
            border-left: 3px solid var(--gold);
            background: #f2eadb;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 28px 21px;
            }
        }
    </style>
</head>

<body>
    <div class="register-container">
        <div class="register-card">

            <p class="brand-label">Elegance Beauty Salon</p>

            <h1>Create Your Account</h1>

            <p class="intro">
                Join us to book your favourite salon services and manage your appointments.
            </p>

            {% if messages %}
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="register-button">
                    Create Account
                </button>
            </form>

            <div class="login-text">
                Already have an account?
                <a href="{% url 'login' %}">Sign in</a>
            </div>

            <a href="{% url 'home' %}" class="back-link">
                ← Back to Home
            </a>

        </div>
    </div>
</body>
</html>
