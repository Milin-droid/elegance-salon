
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment | Elegance Beauty Salon</title>

<style>
    :root {
        --cream: #f8f4ec;
        --white: #fffdf9;
        --black: #171613;
        --gold: #bd9145;
        --gold-dark: #95641f;
        --muted: #6f6b64;
        --border: #e8dfd1;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--cream);
        color: var(--black);
        line-height: 1.55;
    }

    .booking-container {
        width: min(680px, 92%);
        margin: 55px auto;
    }

    .booking-card {
        background: var(--white);
        border: 1px solid var(--border);
        padding: 38px;
        box-shadow: 0 12px 35px rgba(23, 22, 19, 0.06);
    }

    .brand-label {
        color: var(--gold-dark);
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 3px;
        text-transform: uppercase;
    }

    h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: normal;
        font-size: clamp(32px, 5vw, 45px);
        line-height: 1.15;
        margin: 12px 0;
    }

    .intro {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 21px;
    }

    label {
        display: block;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    input, select {
        width: 100%;
        padding: 14px;
        background: #fff;
        color: var(--black);
        border: 1px solid var(--border);
        border-radius: 3px;
        font: inherit;
        outline: none;
    }

    input:focus, select:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(189, 145, 69, 0.13);
    }

    .submit-button {
        width: 100%;
        padding: 15px;
        background: var(--black);
        color: white;
        border: 1px solid var(--black);
        cursor: pointer;
        font-weight: bold;
        transition: .2s ease;
    }

    .submit-button:hover {
        background: var(--gold-dark);
        border-color: var(--gold-dark);
    }

    .message {
        padding: 12px;
        margin: 12px 0;
        background: #f2eadb;
        border-left: 3px solid var(--gold);
        font-size: 13px;
    }

    .back-link {
        display: inline-block;
        margin-top: 22px;
        color: var(--gold-dark);
        font-size: 13px;
        text-decoration: none;
    }

    .back-link:hover {
        text-decoration: underline;
    }

    @media (max-width: 500px) {
        .booking-container {
            margin: 24px auto;
        }

        .booking-card {
            padding: 24px 19px;
        }
    }
</style>

</head>

<body>

    <div class="booking-container">
        <div class="booking-card">

            <p class="brand-label">Elegance Beauty Salon</p>

            <h1>Book Your Appointment</h1>

            <p class="intro">
                Choose your preferred service, stylist, date and time.
                We look forward to welcoming you.
            </p>

            {% if messages %}
                {% for message in messages %}
                    <p class="message">{{ message }}</p>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="service">Choose a Service</label>

                    <select name="service" id="service" required>
                        <option value="">Select a service</option>

                        {% for service in services %}
                            <option value="{{ service.id }}">
                                {{ service.name }} — KSh {{ service.price }} — {{ service.duration_minutes }} minutes
                            </option>
                        {% empty %}
                            <option value="">No services available</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="stylist">Choose a Stylist</label>

                    <select name="stylist" id="stylist" required>
                        <option value="">Select a stylist</option>

                        {% for stylist in stylists %}
                            <option value="{{ stylist.id }}">
                                {{ stylist.name }}
                            </option>
                        {% empty %}
                            <option value="">No stylists available</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="appointment_date">Appointment Date</label>

                    <input
                        type="date"
                        name="appointment_date"
                        id="appointment_date"
                        min="{{ today }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="appointment_time">Appointment Time</label>

                    <input
                        type="time"
                        name="appointment_time"
                        id="appointment_time"
                        required
                    >
                </div>

                <button type="submit" class="submit-button">
                    Confirm Appointment
                </button>
            </form>

            <a href="/" class="back-link">← Back to Home</a>

        </div>
    </div>

</body>

</html>
