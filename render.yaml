
services:
  - type: web
    name: elegance-salon
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "elegance-salon.onrender.com"
